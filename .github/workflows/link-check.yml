name: Check Links

on:
  schedule:
    # Off the hour: the 02:00 slot started a median 4.9 hours late.
    - cron: '43 9 * * *'
  workflow_dispatch:

# Every writer commits to main, so they run one at a time. queue: max keeps
# each pending run instead of cancelling the older one. add-listing joins the
# same group at job level.
concurrency:
  group: readme-updates
  queue: max

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check links
        run: python .github/scripts/check_links.py

      - name: Commit closed positions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Problems already on main only warn, so one old bad row cannot block
          # every run until someone fixes it by hand.
          git show HEAD:listings.json > "$RUNNER_TEMP/listings.base.json"
          python .github/scripts/check_outputs.py --baseline "$RUNNER_TEMP/listings.base.json"
          git add README.md listings.json companies.md
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "mark closed positions"
          before=$(git rev-parse HEAD)
          # -X theirs keeps this run's side of a conflicting hunk, which can
          # drop a row another writer pushed meanwhile. When main moved
          # listings.json, rebuild the README from the merged file and check it
          # again before pushing.
          git pull --rebase -X theirs
          if ! git diff --quiet "$before" HEAD -- listings.json; then
            python .github/scripts/rebuild_readme.py
            git show HEAD~1:listings.json > "$RUNNER_TEMP/listings.base.json"
            python .github/scripts/check_outputs.py --baseline "$RUNNER_TEMP/listings.base.json"
            git add listings.json README.md companies.md
            git diff --staged --quiet || git commit --amend --no-edit
          fi
          git push
