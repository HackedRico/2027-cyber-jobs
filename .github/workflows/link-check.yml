name: Check Links

on:
  schedule:
    # Off the hour: the 02:00 slot started a median 4.9 hours late.
    - cron: '43 9 * * *'
  workflow_dispatch:
    inputs:
      allow_mass_close:
        description: Let check_outputs pass a run that closes more than a quarter of the open rows
        type: boolean
        default: false

# Every writer commits to main, so they run one at a time. queue: max keeps
# each pending run instead of cancelling the older one. add-listing joins the
# same group at job level.
concurrency:
  group: readme-updates
  queue: max

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # main as it stands when this run leaves the readme-updates queue, not
      # the commit it was triggered at. A queued run built on the older
      # listings.json and its pull-rebase with -X theirs could drop the rows
      # the writer ahead of it pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # No token left in .git/config while pip installs and the scripts
          # run. Only the push below is handed one.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Check links
        run: python .github/scripts/check_links.py

      - name: Commit closed positions
        env:
          # A dispatch that ticked allow_mass_close; empty on a scheduled run.
          ALLOW_MASS_CLOSE: ${{ inputs.allow_mass_close }}
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Problems already on main only warn, so one old bad row cannot block
          # every run until someone fixes it by hand.
          git show HEAD:listings.json > "$RUNNER_TEMP/listings.base.json"
          python .github/scripts/check_outputs.py --baseline "$RUNNER_TEMP/listings.base.json"
          git add README.md listings.json companies.md
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "mark closed positions"
          before=$(git rev-parse HEAD)
          # -X theirs keeps this run's side of a conflicting hunk, which can
          # drop a row another writer pushed meanwhile. When main moved
          # listings.json, rebuild the README from the merged file and check it
          # again before pushing.
          # The token lives only in this step, passed per command, the way
          # actions/checkout would have stored it for the whole job.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth" pull --rebase -X theirs
          if ! git diff --quiet "$before" HEAD -- listings.json; then
            python .github/scripts/rebuild_readme.py
            git show HEAD~1:listings.json > "$RUNNER_TEMP/listings.base.json"
            python .github/scripts/check_outputs.py --baseline "$RUNNER_TEMP/listings.base.json"
            git add listings.json README.md companies.md
            git diff --staged --quiet || git commit --amend --no-edit
          fi
          git -c http.https://github.com/.extraheader="$auth" push
