name: Validate Job Submission

on:
  issues:
    types: [opened, edited]

# A burst of edits posts one verdict: the newest run replaces the older ones.
concurrency:
  group: validate-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    # The title prefix catches a submission whose form labels did not apply,
    # which is what happened while the 'new listing' label did not exist.
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'new listing') ||
       startsWith(github.event.issue.title, '[JOB]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/validate_issue.py
