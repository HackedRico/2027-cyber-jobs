name: Add Approved Listings

on:
  issues:
    types: [labeled]

jobs:
  add-listing:
    if: github.event.label.name == 'approved'
    # Shares readme-updates with the other writers. At job level, a label
    # event other than 'approved' skips before it joins the queue, so it can
    # never displace a pending writer run.
    concurrency:
      group: readme-updates
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process all approved issues
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Hands the added rows to "Announce new roles", outside the checkout
          # so the commit step never picks it up. Set per step because the
          # runner context is not available in job-level env.
          RUN_EVENTS_FILE: ${{ runner.temp }}/run_events.json
        run: python .github/scripts/process_approved.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Problems already on main only warn, so one old bad row cannot block
          # every run until someone fixes it by hand.
          git show HEAD:listings.json > "$RUNNER_TEMP/listings.base.json"
          python .github/scripts/check_outputs.py --baseline "$RUNNER_TEMP/listings.base.json"
          git add listings.json README.md companies.md
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "add community-submitted listings"
          before=$(git rev-parse HEAD)
          # -X theirs keeps this run's side of a conflicting hunk, which can
          # drop a row another writer pushed meanwhile. When main moved
          # listings.json, rebuild the README from the merged file and check it
          # again before pushing.
          git pull --rebase -X theirs
          if ! git diff --quiet "$before" HEAD -- listings.json; then
            python .github/scripts/rebuild_readme.py
            git show HEAD~1:listings.json > "$RUNNER_TEMP/listings.base.json"
            python .github/scripts/check_outputs.py --baseline "$RUNNER_TEMP/listings.base.json"
            git add listings.json README.md companies.md
            git diff --staged --quiet || git commit --amend --no-edit
          fi
          git push

      # Default if: success() means this fires only when the push above landed,
      # so no release or alert links to a row that is not on main. A community
      # row reaches the same alert streams as a scraped one.
      - name: Announce new roles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_EVENTS_FILE: ${{ runner.temp }}/run_events.json
        run: python .github/scripts/notify.py

      # Runs after the push so an issue closes only once its row is on main. A
      # failed push leaves added issues open and approved for the next run.
      - name: Notify submitters
        if: always() && steps.process.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESULTS: ${{ steps.process.outputs.results }}
          PUSHED: ${{ steps.commit.outcome == 'success' }}
        run: python .github/scripts/process_approved.py --notify
