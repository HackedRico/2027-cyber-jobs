name: Scrape Clock

on:
  schedule:
    # GitHub starts a scheduled run hours after its cron time, so the scrape
    # does not wait on one event. Each tick asks whether an 11:17 or 23:17 UTC
    # slot has passed with no scrape run and dispatches the scrape if so.
    # Ticks arrive as late as any scheduled run, but spread across the day.
    # A run GITHUB_TOKEN dispatched raises no workflow_run event, so each tick
    # also dispatches Pages and Scraper Health when neither has run since the
    # newest finished scrape.
    - cron: '7,37 * * * *'
  workflow_dispatch:

# One tick at a time: a tick leaves only after the run it dispatched shows in
# the run list, so the tick behind it cannot start a second scrape. The tick
# that starts a scrape stays until it finishes, to publish its rows at once.
# queue: max keeps each waiting tick, here and in the clock jobs of health.yml
# and pages.yml, which join this group.
concurrency:
  group: scrape-clock
  queue: max

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    # The tick that starts a scrape waits up to 35 minutes for it to finish.
    timeout-minutes: 45
    permissions:
      # Dispatching a workflow is an Actions write. A dispatch is one of the
      # two events GITHUB_TOKEN may raise that still start a workflow run.
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Start the scrape if its slot is due, then its followers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/scrape_clock.py
