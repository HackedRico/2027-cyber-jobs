name: Scrape Job Boards

on:
  schedule:
    # Off the hour: runs at :00 started a median 2.6 to 5.2 hours late.
    - cron: '17 11,23 * * *'
  workflow_dispatch:

# Every writer commits to main, so they run one at a time. queue: max keeps
# each pending run instead of cancelling the older one. add-listing joins the
# same group at job level.
concurrency:
  group: readme-updates
  queue: max

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The pooled scrape finishes in a few minutes; the margin covers a bad day
    # of slow hosts. The scrape step's own 25-minute limit fires first, which
    # reports "failed" rather than the "cancelled" a job timeout shows.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      # main as it stands when this run leaves the readme-updates queue, not
      # the commit it was triggered at. A queued run built on the older
      # listings.json and its pull-rebase with -X theirs could drop the rows
      # the writer ahead of it pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape job boards
        timeout-minutes: 25
        env:
          # Flush each line as it prints so a timed-out run's log shows where
          # it stalled instead of one burst of buffered output at the end.
          PYTHONUNBUFFERED: '1'
          # Hands this run's new rows to "Announce new roles". It lives outside
          # the checkout so the commit step can never pick it up. Set per step
          # because the runner context is not available in job-level env.
          RUN_EVENTS_FILE: ${{ runner.temp }}/run_events.json
        run: python .github/scripts/scrape_jobs.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Problems already on main only warn, so one old bad row cannot block
          # every run until someone fixes it by hand.
          git show HEAD:listings.json > "$RUNNER_TEMP/listings.base.json"
          python .github/scripts/check_outputs.py --baseline "$RUNNER_TEMP/listings.base.json"
          git add .github/data/seen_jobs.json .github/data/board_baseline.json .github/data/health.json listings.json README.md companies.md
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "add auto-discovered listings"
          before=$(git rev-parse HEAD)
          # -X theirs keeps this run's side of a conflicting hunk, which can
          # drop a row another writer pushed meanwhile. When main moved
          # listings.json, rebuild the README from the merged file and check it
          # again before pushing.
          git pull --rebase -X theirs
          if ! git diff --quiet "$before" HEAD -- listings.json; then
            python .github/scripts/rebuild_readme.py
            git show HEAD~1:listings.json > "$RUNNER_TEMP/listings.base.json"
            python .github/scripts/check_outputs.py --baseline "$RUNNER_TEMP/listings.base.json"
            git add listings.json README.md companies.md
            git diff --staged --quiet || git commit --amend --no-edit
          fi
          git push

      # Default if: success() means this fires only when the push above landed,
      # so no release or alert links to a row that is not on main. The rows
      # are already pushed by then, so a failed announcement shows on the step
      # without failing the run, which would skip the Pages deploy.
      - name: Announce new roles
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_EVENTS_FILE: ${{ runner.temp }}/run_events.json
        run: python .github/scripts/notify.py
