name: Scrape Job Boards

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

concurrency:
  group: readme-updates
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape job boards
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python .github/scripts/scrape_jobs.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/seen_jobs.json .github/data/board_baseline.json listings.json README.md companies.md
          git diff --staged --quiet || git commit -m "add auto-discovered listings"
          # -X theirs keeps the bot's freshly-scraped rows (listings.json is the
          # source of truth) on a rare concurrent-push conflict, rather than
          # silently dropping them.
          git pull --rebase -X theirs && git push
