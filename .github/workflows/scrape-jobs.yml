name: Scrape Job Boards

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

concurrency:
  group: readme-updates
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The pooled scrape finishes in a few minutes; the margin covers a bad day
    # of slow hosts. Runs that hit this show as "cancelled", not "failed", so
    # keep it generous rather than silently losing a whole scrape.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape job boards
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          # Flush each line as it prints so a timed-out run's log shows where
          # it stalled instead of one burst of buffered output at the end.
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/scrape_jobs.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/seen_jobs.json .github/data/board_baseline.json listings.json README.md companies.md
          git diff --staged --quiet || git commit -m "add auto-discovered listings"
          # -X theirs keeps the bot's freshly-scraped rows (listings.json is the
          # source of truth) on a rare concurrent-push conflict, rather than
          # silently dropping them.
          git pull --rebase -X theirs && git push
