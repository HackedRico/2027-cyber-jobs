<!doctype html>
<!-- Source for site/social-preview-v2.png, the 1280x640 card GitHub and chat apps
     show for a shared link. It follows the board's dark theme in site/styles.css:
     graphite, one signal lime, Instrument Sans and Martian Mono. Rebuild with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
       --hide-scrollbars --virtual-time-budget=8000 --window-size=1280,640 \
       --screenshot=site/social-preview-v2.png .github/social-card.html
     Chat apps cache a card by its URL for days, so a redesign ships under a new
     file name and index.html points at it. No counts on the card: they would go
     stale between rebuilds. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/instrument-sans@5.3.0/wdth.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/martian-mono@5.3.0/index.css">
<style>
  :root {
    --bg: #0b0d10; --panel: #0e1115; --line-2: #2c343e;
    --ink: #e8ebef; --ink-2: #a9b1bc; --ink-3: #7d8792;
    --signal: #c6f432; --on-signal: #0b0d10;
    --grid: rgba(232, 235, 239, 0.05);
    --sans: 'Instrument Sans Variable', 'Instrument Sans', system-ui, sans-serif;
    --mono: 'Martian Mono Variable', 'Martian Mono', ui-monospace, monospace;
  }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body {
    background-image:
      radial-gradient(900px 420px at 18% -10%, rgba(198, 244, 50, 0.10), transparent 70%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: auto, 40px 40px, 40px 40px;
    color: var(--ink);
    font-family: var(--sans);
    box-sizing: border-box;
    padding: 64px 80px 68px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 34px; letter-spacing: -0.015em; }
  .brand svg { width: 52px; height: 52px; }
  .year {
    font: 600 22px/1 var(--mono); padding: 8px 10px 6px; border-radius: 7px;
    background: var(--ink); color: var(--bg);
  }
  .kicker {
    font: 500 19px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); display: flex; align-items: center; gap: 14px; margin-top: 46px;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 18px rgba(198, 244, 50, 0.6); }
  h1 { font-size: 74px; line-height: 1.04; margin: 22px 0 0; font-weight: 650; letter-spacing: -0.025em; max-width: 1080px; }
  h1 em { font-style: normal; color: var(--signal); }
  .nw { white-space: nowrap; }
  p { font-size: 30px; line-height: 1.3; margin: 22px 0 0; color: var(--ink-2); max-width: 1000px; }
  .foot { display: flex; gap: 14px; align-items: center; }
  .btn {
    font: 600 22px/1 var(--sans); padding: 15px 22px; border-radius: 12px;
    background: var(--signal); color: var(--on-signal); display: inline-flex; align-items: center; gap: 10px;
  }
  .chip {
    font: 500 18px/1 var(--mono); padding: 15px 18px; border-radius: 12px;
    border: 2px solid var(--line-2); color: var(--ink-2); background: var(--panel);
  }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z" fill="#c6f432"/>
        <path d="m11 16 4 4 7-8" fill="none" stroke="#0b0d10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="year">2027</span><span>Cyber Jobs</span>
    </div>
    <div class="kicker"><span class="dot"></span>US only · for students · updated twice a day</div>
    <h1>Cybersecurity <em>internships</em>, <span class="nw">new-grad</span> and <span class="nw">early-career</span> roles</h1>
    <p>Scraped from hundreds of employer job boards. Search, filter and apply.</p>
  </div>
  <div class="foot">
    <span class="btn">Search the board
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="chip">Email alerts</span>
    <span class="chip">Atom feeds</span>
  </div>
</body>
</html>
